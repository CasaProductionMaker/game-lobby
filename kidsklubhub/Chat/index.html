<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="../styles.css">
		<link rel="stylesheet" type="text/css" href="chat-styles.css">
		<title>Kids Club Chat</title>
	</head>
	<body>
		<header>
			<h3 id="navbar_title">Kids Club Hub - Chat</h3>
	    	<button onclick="loadHomepage()" id="home-button">Home</button>
			<button onclick="logUserOut()" id="logout-button">Logout</button>
		</header>
		<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    	<script type="text/javascript" src="../KeyPressListener.js"></script>
    	<div id="chat-container"></div>
    	<div id="bottom-bar">
			<div id="reply_info">
				<div id="reply_info_text"><img src='../Images/WhiteReplyLine.svg' class='reply_line'><div id="replying_to">Replying to @Lucca</div></div>
				<button onclick="cancelReply()" class="small_button">Cancel</button>
			</div>
			<div id="chat_input_bar">
				<input type="text" name="chat_bar" id="chat_input" placeholder="Enter a message...">
				<button onclick="sendMessage()">Send</button>
			</div>
	    </div>
	    <script type="text/javascript" src="app.js"></script>
	</body>
</html>
