<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="../styles.css">
		<link rel="stylesheet" type="text/css" href="fool-styles.css">
		<link rel="stylesheet" type="text/css" href="../Responsive.css">
		<title>Fool Plans</title>
	</head>
	<body>
		<header>
			<h3 id="navbar_title">Kids Club Hub - Fool Plans</h3>
	    	<button onclick="loadHomepage()" id="home-button">Home</button>
			<button onclick="logUserOut()" id="logout-button">Logout</button>
		</header>
		<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    	<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    	<p>Here, you can plan April Fools to play on your friends! Collaborate, or come up with a fool yourself.</p>
    	<script type="text/javascript" src="fool-app.js"></script>
	    <div id="createF">
			<div class="form_section">
	    		<label for="name">Name: </label><input type="text" name="name" id="fname">
			</div>
	    	<textarea cols="40" rows="6" id="fdesc"></textarea>
	    	<button onclick="createFool()">Create Fool</button>
	    </div>
	    <div id="editF">
			<div class="form_section">
	    		<label for="name">Name: </label><input type="text" name="name" id="ename">
			</div>
	    	<textarea cols="40" rows="6" id="edesc"></textarea>
	    	<button onclick="applyEditToFool()">Apply Changes</button>
	    </div>
		<div id="fools_container"></div>
	</body>
